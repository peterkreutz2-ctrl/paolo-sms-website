name: Review-Vorschau auf GitHub Pages

# Vorläufige Review-Version (PROTOTYPE = true), keine Produktfreigabe.
# Actions sind auf Commit-SHAs gepinnt; Dependabot hält sie aktuell.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Zunächst ausschließlich die GitHub-Pages-Adresse (Projektseite).
      SITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - name: Quellcode holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren (ohne Installationsskripte)
        run: npm ci --ignore-scripts

      - name: Sicherheitsprüfung der Abhängigkeiten
        run: npm audit --omit=dev --audit-level=high

      - name: Bauen und Struktur prüfen
        run: npm test

      - name: Review-Freigabeprüfung
        run: npm run release:review

      - name: Seite als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
